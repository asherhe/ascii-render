<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ASCII Donut</title>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      image-rendering: pixelated;
      margin: 0;
      overflow: hidden;
      background: #000;
    }

    canvas {
      display: block;
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <canvas id="canvas" class="emscripten" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>

  <script>
    const canvas = document.getElementById("canvas");

    function sizeCanvasForDevicePixels() {
      const rect = canvas.getBoundingClientRect();
      const scale = window.devicePixelRatio || 1;
      canvas.width = Math.round(rect.width * scale);
      canvas.height = Math.round(rect.height * scale);
    }

    sizeCanvasForDevicePixels();
    window.addEventListener("resize", sizeCanvasForDevicePixels);

    var Module = {
      canvas: canvas,
      print: function (text) {
        console.log(text);
      },
      printErr: function (text) {
        console.error(text);
      }
    };
  </script>

  {{{ SCRIPT }}}
</body>
</html>
